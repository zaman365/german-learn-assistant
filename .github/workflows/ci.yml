name: Verify learning app
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: german
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: german_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U german -d german_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://german:isolated-ci-only@localhost:5432/german_test
      APP_URL: http://localhost:4173
      BETTER_AUTH_SECRET: isolated-ci-session-secret-never-use-in-production
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: .data/test-media
      OWNER_EMAIL: learner@example.test
      OWNER_NAME: Test Learner
      OWNER_PASSWORD: isolated-ci-password-never-use-in-production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm owner:create
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          { name: browser-test-results, path: test-results, retention-days: 5 }
